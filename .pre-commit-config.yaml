repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: trailing-whitespace
      - id: end-of-file-fixer
      # - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        args: [--fix, --config=backend/pyproject.toml]
      - id: ruff-format
        args: [--config=backend/pyproject.toml]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        args: [--config-file=backend/pyproject.toml]
        additional_dependencies:
          - pydantic>=2.13.5,<3.0.0
          - pydantic-settings>=2.15.0,<3.0.0
          - sqlalchemy>=2.0.54,<2.1.0
          - alembic>=1.20.0,<1.21.0
          - types-redis>=4.6.0.20241004,<5.0.0
          - types-setuptools>=84.0.0.20260812,<85.0.0
          - fastapi>=0.141.1,<0.142.0
          - celery>=5.6.3,<5.7.0

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
