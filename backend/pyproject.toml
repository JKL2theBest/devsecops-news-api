[project]
name = "news-api-backend"
version = "0.2.0"
description = "CRUD API for a news portal (Fastapi)."
readme = "README.md"
requires-python = ">=3.12,<3.13"

authors = [
    { name = "JKL2theBest", email = "muhammet.jkl2.suhanguylev@gmail.com" }
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.37.0",
    "sqlalchemy[asyncio]>=2.0.40",
    "asyncpg>=0.30.0",
    "alembic>=1.16.0",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.10.0",
    "psycopg2-binary>=2.9.10",
    "fastapi-sso>=0.18.0",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.10.1",
    "python-multipart>=0.0.20",
    "redis[hiredis]>=5.2.0",
    "celery[redis]>=5.4.0",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "structlog>=25.5.0",
    "hawk-python-sdk[fastapi]>=3.5.2",
]

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    "httpx>=0.28.1",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "fakeredis>=2.32.0",
    "pytest-playwright>=0.7.2",
    "nest-asyncio>=1.6.0",
    "pre-commit>=4.1.0",
    "ruff>=0.9.0",
    "mypy>=1.15.0",
]

[build-system]
requires = ["poetry-core>=2.4.3"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
#
