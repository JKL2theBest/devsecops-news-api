[project]
name = "news-api-backend"
version = "0.2.0"
description = "CRUD API for a news portal (Fastapi)."
readme = "README.md"
requires-python = ">=3.12,<3.13"

authors = [
    { name = "JKL2theBest", email = "muhammet.jkl2.suhanguylev@gmail.com" }
]

dependencies = [
    "fastapi>=0.141.1,<0.142.0",
    "fastapi-sso>=0.22.0,<0.23.0",
    "uvicorn[standard]>=0.53.0,<0.54.0",
    "sqlalchemy[asyncio]>=2.0.54,<2.1.0",
    "asyncpg>=0.31.0,<0.32.0",
    "alembic>=1.20.0,<1.21.0",
    "pydantic[email]>=2.13.5,<2.14.0",
    "pydantic-settings>=2.15.0,<2.16.0",
    "psycopg2-binary>=2.9.13,<2.10.0",
    "argon2-cffi>=25.1.0,<26.0.0",
    "pyjwt>=2.14.0,<2.15.0",
    "python-multipart>=0.0.32,<0.1.0",
    "redis[hiredis]>=5.3.1,<6.0.0",
    "celery[redis]>=5.6.3,<5.7.0",
    "prometheus-fastapi-instrumentator>=8.1.0,<8.2.0",
    "prometheus_client>=0.26.0,<0.27.0",
    "structlog>=26.1.0,<27.0.0",
    "hawk-python-sdk[fastapi]>=3.5.2,<3.6.0",
    "nest_asyncio>=1.6.0,<2.0.0",
]

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "pytest-asyncio>=1.4.0,<2.0.0",
    "pytest-mock>=3.15.1,<4.0.0",
    "pytest-playwright>=0.9.0,<1.0.0",
    "playwright>=1.63.0,<2.0.0",
    "httpx>=0.28.1,<0.29.0",
    "fakeredis>=2.38.0,<3.0.0",
    "nest-asyncio>=1.6.0,<2.0.0",
    "pre-commit>=4.6.2,<5.0.0",
    "ruff>=0.16.8,<0.17.0",
    "mypy>=2.3.1,<3.0.0",
]

[build-system]
requires = ["poetry-core>=2.4.3,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
#
