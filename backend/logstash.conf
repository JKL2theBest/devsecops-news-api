input {
  file {
    path => "/app/logs/*.json"
    start_position => "beginning"
    codec => "json"
  }
}

filter {
  date {
    match => [ "timestamp", "ISO8601" ]
    target => "@timestamp"
    remove_field => [ "timestamp" ]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    data_stream => "false"
    index => "fastapi-logs-%{+YYYY.MM.dd}"
  }
  stdout {
    codec => rubydebug
  }
}
